name: deploy-hf-space

# Pushes the repo to a Hugging Face Docker Space. Needs the HF_TOKEN secret (write access).
# Optional: repository variable HF_SPACE (e.g. "user/docex-demo"); defaults to <hf-user>/docex-demo.
# The HF deploy never copies a model key: the demo runs approach A only (paid APIs are disabled, see docs/operations.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with: {python-version: "3.12"}
      - name: Upload to Space
        if: env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.24"
          python deploy/hf_space.py
      - name: Skip (no HF_TOKEN)
        if: env.HF_TOKEN == ''
        run: echo "HF_TOKEN secret not set; skipping deploy"
