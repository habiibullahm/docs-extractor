# Pipeline configuration. Values can be overridden with env vars DOCEX_<SECTION>__<KEY>.

approach: A            # A = OCR + regex, B = OCR + text LLM, C = vision LLM

preprocess:
  dpi: 200
  max_side: 2000
  deskew: true
  fix_orientation: true

ocr:
  provider: tesseract   # tesseract | rapidocr
  languages: "ind+eng"
  psm: 6                # tesseract page segmentation mode (6 won on train, see README)

# Default provider is the Gemini API free tier (GEMINI_API_KEY from a Google project without billing).
# Other options: provider: openai, model: gpt-4.1-mini (OPENAI_API_KEY); provider: anthropic,
# model: claude-opus-5-5 (ANTHROPIC_API_KEY); or a local model with provider: openai_compatible.
# Hosted providers also need DOCEX_ENABLE_LLM=true.
llm:
  provider: gemini      # gemini | openai | anthropic | openai_compatible | mock
  model: gemini-flash-latest   # alias for the current Flash model; check AI Studio for free-tier models
  effort: low           # anthropic only
  max_tokens: 16000
  temperature: null

vlm:
  provider: gemini
  model: gemini-flash-latest
  effort: low
  max_tokens: 16000

gemini:
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  # Free-tier limits are per project and change over time. 6 s apart keeps one process under 10 requests
  # per minute; a 429 is retried max_retries times, then the document fails (nothing is billed).
  min_interval_s: 6
  max_retries: 3

openai_compatible:
  # For a local open-source model served by Ollama / vLLM / llama.cpp.
  base_url: "http://localhost:11434/v1"
  model: "qwen2.5vl:7b"

classify:
  method: auto          # auto = keyword for A/B (uses OCR text), llm for C

prompts:
  extract: extract_v1
  repair: repair_v1
  classify: classify_v1

repair:
  enabled: true
  max_attempts: 1

scoring:
  # Document score = min confidence over critical fields, multiplied by penalties.
  error_penalty: 0.25
  warning_penalty: 0.85
  missing_critical_confidence: 0.0
  # Auto-approve threshold per approach, chosen from the dev-set threshold curve as the
  # highest straight-through rate with <= 1% errors among auto-approved documents
  # (eval/reports/<run>/report.md). B and C: placeholder until their dev eval has run.
  # From the dev curves (eval/reports/*_dev_ci). B and C have no threshold with <= 1% auto-approve error,
  # so 1.0 routes every B/C document to review until their confidence is calibrated.
  thresholds: {A: 0.77, B: 1.0, C: 1.0}

limits:
  max_upload_mb: 10
  rate_limit: "30/minute"
  allowed_types: ["application/pdf", "image/png", "image/jpeg", "image/webp", "image/tiff"]

costs:
  usd_to_idr: 16500           # TODO(verify): update exchange rate before reporting
  cpu_usd_per_hour: 0.05      # assumed price of 1 vCPU-hour for local OCR/compute
  # USD per 1M tokens; keep in sync with provider price lists
  token_prices:
    gpt-4.1-mini: {input: 0.40, output: 1.60}   # TODO(verify): check current OpenAI pricing
    gpt-4.1: {input: 2.00, output: 8.00}
    gpt-4o-mini: {input: 0.15, output: 0.60}
    claude-opus-5-5: {input: 4.00, output: 20.00}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    gemini-flash-latest: {input: 0.0, output: 0.0}   # free tier, no billing; paid-tier prices differ
    mock: {input: 0.0, output: 0.0}
